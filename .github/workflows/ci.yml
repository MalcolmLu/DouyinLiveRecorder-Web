name: Tests and Docker build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt -r gui/requirements.txt -r gui/requirements-youtube.txt
      - run: PYTHONPATH=gui python -m unittest discover -s gui -p 'test_*.py' -v
      - run: PYTHONPATH=gui python -m unittest discover -s tests -v
      - run: node --check gui/static/app.js
      - run: python scripts/check_public_source.py
      - run: docker compose config --quiet

  container:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dlr-web:test .
      - run: docker run --rm dlr-web:test python h265/selftest.py
      - run: python scripts/container_smoke.py dlr-web:test
