name: Tests and Docker build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt -r gui/requirements.txt -r gui/requirements-youtube.txt
      - run: PYTHONPATH=gui python -m unittest discover -s gui -p 'test_*.py' -v
      - run: PYTHONPATH=gui python -m unittest discover -s tests -v
      - run: node --check gui/static/app.js
      - run: python scripts/check_public_source.py
      - run: docker compose config --quiet

  container:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Docker's official ECR mirror avoids anonymous Docker Hub runner limits.
      - run: >-
          docker build -t dlr-web:test
          --build-arg NODE_IMAGE=public.ecr.aws/docker/library/node:22-bookworm-slim
          --build-arg PYTHON_IMAGE=public.ecr.aws/docker/library/python:3.11-slim-trixie .
      - run: docker run --rm dlr-web:test python h265/selftest.py
      - run: python scripts/container_smoke.py dlr-web:test
